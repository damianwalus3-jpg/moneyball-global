name: Deploy MONEYBALL rebuild to Cloudflare Free Worker
on:
  push:
    branches: [moneyball-rebuild]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moneyball-global-rebuild-v3
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Provision durable Tracker diagnostics storage when token permits
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          LIST="$(curl --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100")"
          if ! echo "$LIST" | jq -e '.success == true' >/dev/null; then
            echo "::warning::Cloudflare token cannot list KV namespaces; deploy continues with temporary diagnostics cache."
            exit 0
          fi
          NS_ID="$(echo "$LIST" | jq -r '.result[] | select(.title == "moneyball-global-rebuild-tracker-diagnostics") | .id' | head -n 1)"
          if [ -z "$NS_ID" ]; then
            CREATED="$(curl --silent --show-error -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$API" --data '{"title":"moneyball-global-rebuild-tracker-diagnostics"}')"
            if ! echo "$CREATED" | jq -e '.success == true and (.result.id | type == "string")' >/dev/null; then
              echo "::warning::Cloudflare KV namespace creation unavailable; deploy continues with temporary diagnostics cache."
              exit 0
            fi
            NS_ID="$(echo "$CREATED" | jq -r '.result.id')"
          fi
          KV_ID="$NS_ID" node -e 'const fs=require("fs");const p="wrangler.jsonc";const c=JSON.parse(fs.readFileSync(p,"utf8"));c.kv_namespaces=(c.kv_namespaces??[]).filter(x=>x.binding!=="TRACKER_DIAGNOSTICS");c.kv_namespaces.push({binding:"TRACKER_DIAGNOSTICS",id:process.env.KV_ID});fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
          echo "Durable Cloudflare KV binding configured for this deployment."
      - name: Deploy static app to separate Cloudflare Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production worker and free PitchAPI xG source
        run: |
          set -euo pipefail
          BASE="https://moneyball-global-rebuild.damianwalus3.workers.dev"
          PAGE="$(curl --fail --location --silent --show-error "$BASE/")"
          echo "$PAGE" | grep -q 'id="root"'
          ASSET="$(echo "$PAGE" | grep -oE '/assets/[^"]+\.js' | head -n 1)"
          test -n "$ASSET"
          curl --fail --location --silent --show-error "$BASE$ASSET" -o /dev/null
          HEALTH="$(curl --fail --silent --show-error "$BASE/api/health")"
          echo "$HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.ok!==true||p.service!=="moneyball-global-rebuild"||p.pitchapiConfigured!==true){console.error("Production health check failed:",p);process.exit(1)}})'
          ODDS_STATUS="$(curl --fail --silent --show-error "$BASE/api/odds/status")"
          echo "$ODDS_STATUS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.providers?.apiFootball!==true||p.providers?.oddspapi!==true||p.pilotEnabled!==true){console.error("Odds provider configuration or owner gate is missing:",p);process.exit(1)}if(p.oddspapiAccount?.status==="active"){console.log("OddsPapi account OK:",p.oddspapiAccount.requestCount,"/",p.oddspapiAccount.requestLimit,"used; remaining:",p.oddspapiAccount.remaining)}else{console.warn("OddsPapi account status temporarily unavailable; no billable odds request was made:",p.oddspapiAccount?.error??p.oddspapiAccount?.status)}})'
          TODAY_BRUSSELS="$(TZ=Europe/Brussels date +%F)"
          API_FOOTBALL_ODDS_GUARD="$(curl --silent --show-error "$BASE/api/api-football/odds?date=$TODAY_BRUSSELS&ids=invalid")"
          echo "$API_FOOTBALL_ODDS_GUARD" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.error!=="invalid_api_football_odds_query"){console.error("API-Football odds guard smoke test failed:",p);process.exit(1)}console.log("API-Football odds route and preflight guard OK; no provider request made")})'
          curl --fail --location --silent --show-error "$BASE/api/pitchapi/leagues" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(!Array.isArray(p.data?.leagues)||p.data.leagues.length===0){console.error("PitchAPI returned no league catalogue");process.exit(1)}console.log("PitchAPI catalogue OK:",p.data.leagues.length,"leagues")})'
          TODAY="$(TZ=Europe/Brussels date +%F)"
          curl --fail --location --silent --show-error "$BASE/api/pitchapi/date/$TODAY?status=all" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(!Array.isArray(p.data?.matches)){console.error("PitchAPI date feed missing data.matches:",p);process.exit(1)}console.log("PitchAPI live date feed OK:",p.data.matches.length,"matches for",p.data.date)})'
          curl --fail --location --silent --show-error "$BASE/api/footynomad/fixtures/$TODAY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(!Array.isArray(p.fixtures)||!Number.isInteger(p.pagesChecked)||p.pagesChecked<1){console.error("FootyNomad live date feed invalid:",p);process.exit(1)}console.log("FootyNomad live date feed OK:",p.fixtures.length,"European fixtures from",p.pagesChecked,"UTC pages")})'
          API_FOOTBALL_CONFIGURED="$(echo "$HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).apiFootballConfigured?"yes":"no"))')"
          if [ "$API_FOOTBALL_CONFIGURED" = "yes" ]; then
            API_FOOTBALL_ACCOUNT_STATUS="$(curl --silent --show-error -o /tmp/api-football-status.json -w "%{http_code}" "$BASE/api/api-football/status")"
            if [ "$API_FOOTBALL_ACCOUNT_STATUS" = "200" ]; then
              node -e 'const p=require("/tmp/api-football-status.json");if(p.provider!=="API-Football Pro"||typeof p.requests!=="object"||typeof p.subscription!=="object"||JSON.stringify(p).includes("email")||JSON.stringify(p).includes("server-only-test-secret")){console.error("API-Football status response invalid or unsafe");process.exit(1)}console.log("API-Football subscription diagnostics OK:",p.subscription.plan,"active:",p.subscription.active,"per-minute remaining:",p.requests.perMinuteRemaining,"daily remaining:",p.requests.dailyRemaining)'
            elif [ "$API_FOOTBALL_ACCOUNT_STATUS" = "429" ]; then
              node -e 'const p=require("/tmp/api-football-status.json");if(p.error!=="api_football_rate_limited"){console.error("Unexpected API-Football status 429:",p);process.exit(1)}console.log("API-Football status temporarily rate-limited; safe diagnostics verified:",p.providerError ?? p.error)'
            else
              cat /tmp/api-football-status.json
              echo "API-Football status endpoint returned unexpected HTTP $API_FOOTBALL_ACCOUNT_STATUS"
              exit 1
            fi
          fi
          API_FOOTBALL_STATUS="$(curl --silent --show-error -o /tmp/api-football.json -w "%{http_code}" "$BASE/api/api-football/fixtures/$TODAY")"
          if [ "$API_FOOTBALL_CONFIGURED" = "yes" ]; then
            if [ "$API_FOOTBALL_STATUS" = "200" ]; then
              node -e 'const p=require("/tmp/api-football.json");if(p.provider!=="API-Football Pro"||!Array.isArray(p.fixtures)||typeof p.results!=="number"){console.error("API-Football response shape invalid",p);process.exit(1)}console.log("API-Football Pro OK:",p.results,"fixtures for",p.date)'
            elif [ "$API_FOOTBALL_STATUS" = "429" ]; then
              node -e 'const p=require("/tmp/api-football.json");if(p.error!=="api_football_rate_limited"){console.error("Unexpected API-Football HTTP 429:",p);process.exit(1)}console.log("API-Football Pro temporarily rate-limited; safe gateway response verified:",p.providerError ?? p.error)'
            else
              cat /tmp/api-football.json
              echo "API-Football configured but gateway returned unexpected HTTP $API_FOOTBALL_STATUS"
              exit 1
            fi
          else
            test "$API_FOOTBALL_STATUS" = "503" || { cat /tmp/api-football.json; echo "API-Football secret status unexpected"; exit 1; }
            echo "API-Football gateway deployed; API_FOOTBALL_KEY secret is not configured in this Worker."
          fi
      - name: Verify owner Tracker diagnostics rejects unauthenticated access
        run: |
          set -euo pipefail
          BASE="https://moneyball-global-rebuild.damianwalus3.workers.dev"
          STATUS="$(curl --silent --show-error -o /tmp/tracker-diagnostics-unauth.json -w "%{http_code}" "$BASE/api/owner/tracker-diagnostics")"
          if [ "$STATUS" != "401" ]; then
            cat /tmp/tracker-diagnostics-unauth.json
            echo "Owner Tracker diagnostics must reject unauthenticated requests with HTTP 401; got $STATUS"
            exit 1
          fi
          node -e 'const p=require("/tmp/tracker-diagnostics-unauth.json");if(p.error!=="unauthorized"){console.error("Unexpected owner diagnostics response",p);process.exit(1)}console.log("Owner Tracker diagnostics security check OK: unauthenticated access rejected")'
      - name: Full current-day European source reconciliation
        run: npx --yes tsx scripts/audit-live-fixtures.ts
