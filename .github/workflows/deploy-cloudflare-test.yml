name: Deploy Cloudflare test Worker

on:
  workflow_dispatch:
  push:
    branches:
      - migration/cloudflare-workers-setup
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare-test.yml"

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: cloudflare-test
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-workers-setup

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build for Cloudflare
        run: bun run build

      - name: Deploy isolated test Worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
