name: Vercel deployment status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Use native Vercel Git integration
        run: |
          echo "Production deployments are handled by the connected Vercel Git integration."
          echo "GitHub Actions does not need VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID."
          echo "Build, type-check and tests are enforced by the Moneyball CI workflow."
