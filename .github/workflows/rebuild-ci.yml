name: MONEYBALL rebuild CI
on:
  push:
    branches: [moneyball-rebuild]
  pull_request:
    branches: [moneyball-rebuild]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
