name: Deploy MONEYBALL rebuild to Cloudflare Free Worker
on:
  push:
    branches: [moneyball-rebuild]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moneyball-global-rebuild-v3
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Deploy static app to separate Cloudflare Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production worker and free PitchAPI xG source
        run: |
          set -euo pipefail
          BASE="https://moneyball-global-rebuild.damianwalus3.workers.dev"
          PAGE="$(curl --fail --location --silent --show-error "$BASE/")"
          echo "$PAGE" | grep -q 'id="root"'
          ASSET="$(echo "$PAGE" | grep -oE '/assets/[^"]+\.js' | head -n 1)"
          test -n "$ASSET"
          curl --fail --location --silent --show-error "$BASE$ASSET" -o /dev/null
          HEALTH="$(curl --fail --silent --show-error "$BASE/api/health")"
          echo "$HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.ok!==true||p.service!=="moneyball-global-rebuild"||p.pitchapiConfigured!==true){console.error("Production health check failed:",p);process.exit(1)}})'
          curl --fail --location --silent --show-error "$BASE/api/pitchapi/leagues" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(!Array.isArray(p.data?.leagues)||p.data.leagues.length===0){console.error("PitchAPI returned no league catalogue");process.exit(1)}console.log("PitchAPI catalogue OK:",p.data.leagues.length,"leagues")})'
          TODAY="$(TZ=Europe/Brussels date +%F)"
          curl --fail --location --silent --show-error "$BASE/api/pitchapi/date/$TODAY?status=all" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(!Array.isArray(p.data?.matches)){console.error("PitchAPI date feed missing data.matches:",p);process.exit(1)}console.log("PitchAPI live date feed OK:",p.data.matches.length,"matches for",p.data.date)})'
          curl --fail --location --silent --show-error "$BASE/api/footynomad/fixtures/$TODAY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(!Array.isArray(p.fixtures)||!Number.isInteger(p.pagesChecked)||p.pagesChecked<1){console.error("FootyNomad live date feed invalid:",p);process.exit(1)}console.log("FootyNomad live date feed OK:",p.fixtures.length,"European fixtures from",p.pagesChecked,"UTC pages")})'
          API_FOOTBALL_CONFIGURED="$(echo "$HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).apiFootballConfigured?"yes":"no"))')"
          if [ "$API_FOOTBALL_CONFIGURED" = "yes" ]; then
            API_FOOTBALL_ACCOUNT_STATUS="$(curl --silent --show-error -o /tmp/api-football-status.json -w "%{http_code}" "$BASE/api/api-football/status")"
            test "$API_FOOTBALL_ACCOUNT_STATUS" = "200" || { cat /tmp/api-football-status.json; echo "API-Football status endpoint failed"; exit 1; }
            node -e 'const p=require("/tmp/api-football-status.json");if(p.provider!=="API-Football Pro"||typeof p.requests!=="object"||typeof p.subscription!=="object"||JSON.stringify(p).includes("email")||JSON.stringify(p).includes("server-only-test-secret")){console.error("API-Football status response invalid or unsafe");process.exit(1)}console.log("API-Football subscription diagnostics OK:",p.subscription.plan,"active:",p.subscription.active,"per-minute remaining:",p.requests.perMinuteRemaining,"daily remaining:",p.requests.dailyRemaining)'
          fi
          API_FOOTBALL_STATUS="$(curl --silent --show-error -o /tmp/api-football.json -w "%{http_code}" "$BASE/api/api-football/fixtures/$TODAY")"
          if [ "$API_FOOTBALL_CONFIGURED" = "yes" ]; then
            test "$API_FOOTBALL_STATUS" = "200" || { cat /tmp/api-football.json; echo "API-Football configured but gateway did not return HTTP 200"; exit 1; }
            node -e 'const p=require("/tmp/api-football.json");if(p.provider!=="API-Football Pro"||!Array.isArray(p.fixtures)||typeof p.results!=="number"){console.error("API-Football response shape invalid",p);process.exit(1)}console.log("API-Football Pro OK:",p.results,"fixtures for",p.date)'
          else
            test "$API_FOOTBALL_STATUS" = "503" || { cat /tmp/api-football.json; echo "API-Football secret status unexpected"; exit 1; }
            echo "API-Football gateway deployed; API_FOOTBALL_KEY secret is not configured in this Worker."
          fi
      - name: Full current-day European source reconciliation
        run: npx --yes tsx scripts/audit-live-fixtures.ts
