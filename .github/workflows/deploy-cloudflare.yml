name: Deploy Moneyball Global to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moneyball-global-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Deno
        uses: denoland/setup-deno@v2
      - name: Type-check Supabase Edge Functions
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/*/index.ts

      - name: Run tests
        run: bun run test

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build for Cloudflare Workers
        run: bun run build
        env:
          NITRO_PRESET: cloudflare_module

      - name: Deploy to Cloudflare Workers
        run: bunx nitro deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Cloudflare API token and locate production D1 database
        id: verify-d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) {
            console.error("Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret.");
            process.exit(1);
          }
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database`, {
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success !== true) {
            const messages = (payload.errors || []).map(e => e.message).join("; ") || `HTTP ${response.status}`;
            console.error(`Cloudflare D1 API check failed: ${messages}`);
            console.error("Check that this token has Account / D1 / Edit permission and that the saved GitHub secret contains the updated token.");
            process.exit(1);
          }
          const databases = payload.result || [];
          const database = databases.find(db => db.name === "moneyball-global-db");
          if (!database) {
            console.error("Cloudflare API token works, but D1 database moneyball-global-db was not found in this account.");
            console.error(`D1 databases visible to this token: ${databases.map(db => db.name).join(", ") || "(none)" }`);
            process.exit(1);
          }
          if (!database.uuid) {
            console.error("D1 database was found but Cloudflare did not return its database UUID.");
            process.exit(1);
          }
          console.log("Cloudflare API token: valid");
          console.log("D1 permission: confirmed by successful database listing");
          console.log(`Production D1 database found: ${database.name}`);
          console.log(`D1 database ID: ${database.uuid}`);
          function coreOutput(name, value) {
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          NODE
