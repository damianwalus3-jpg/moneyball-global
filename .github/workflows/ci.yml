name: Moneyball CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Deno
        uses: denoland/setup-deno@v2
      - name: Test geographic Europe scope helper
        run: deno test --no-check supabase/functions/_shared/geographic-europe.test.ts
      - name: Test all-tier European domestic league scope
        run: deno test --no-check supabase/functions/_shared/domestic-league-scope.test.ts
      - name: Test bearer token extraction
        run: deno test --no-check supabase/functions/_shared/bearer-token.test.ts
      - name: Test shared team normalization and reserve exclusions
        run: deno test --no-check supabase/functions/_shared/team-normalization.test.ts
      - name: Type-check Supabase Edge Functions
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/*/index.ts
      - name: Run tests
        run: bun run test
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
