name: Deploy MONEYBALL rebuild to Cloudflare Free Worker
on:
  push:
    branches: [moneyball-rebuild]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moneyball-global-rebuild-v3
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Deploy static app to separate Cloudflare Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production worker and free PitchAPI xG source
        run: |
          set -euo pipefail
          BASE="https://moneyball-global-rebuild.damianwalus3.workers.dev"
          PAGE="$(curl --fail --location --silent --show-error "$BASE/")"
          echo "$PAGE" | grep -q 'id="root"'
          ASSET="$(echo "$PAGE" | grep -oE '/assets/[^"]+\.js' | head -n 1)"
          test -n "$ASSET"
          curl --fail --location --silent --show-error "$BASE$ASSET" -o /dev/null
          HEALTH="$(curl --fail --silent --show-error "$BASE/api/health")"
          echo "$HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.ok!==true||p.service!=="moneyball-global-rebuild"||p.pitchapiConfigured!==true){console.error("Production health check failed:",p);process.exit(1)}})'
          curl --fail --location --silent --show-error "$BASE/api/pitchapi/leagues" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(!Array.isArray(p.data?.leagues)||p.data.leagues.length===0){console.error("PitchAPI returned no league catalogue");process.exit(1)}console.log("PitchAPI catalogue OK:",p.data.leagues.length,"leagues")})'
